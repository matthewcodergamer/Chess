name: QQURZ one-time stable UI class migration

on:
  push:
    branches:
      - feature/design-consistency-pass
    paths:
      - .qqurz-one-time-design-cleanup

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/design-consistency-pass
          fetch-depth: 0

      - name: Skip after cleanup marker is removed
        shell: bash
        run: |
          if [ ! -f .qqurz-one-time-design-cleanup ]; then
            echo "Cleanup marker has been removed; nothing to do."
            exit 0
          fi

      - name: Replace legacy presentation class names
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'premium-page-v14': 'premium-page',
              'page-heading-v14': 'page-heading',
              'inline-message-v14': 'inline-message',
              'detail-heading-v22': 'detail-heading',
              'detail-tabs-v22': 'detail-tabs',
              'tournament-page-v22': 'tournament-page',
          }

          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.css'}:
                  continue
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          onboarding = Path('src/styles/onboarding.css')
          text = onboarding.read_text()
          old = 'background:radial-gradient(circle at top,color-mix(in srgb,var(--q-action) 10%,transparent),transparent 32%),var(--q-bg)'
          updated = text.replace(old, 'background:var(--q-bg)')
          if updated == text:
              raise SystemExit('Expected onboarding gradient was not found; refusing a silent migration.')
          onboarding.write_text(updated)

      - name: Verify migration
        shell: bash
        run: |
          if grep -R -n -E 'premium-page-v14|page-heading-v14|inline-message-v14|detail-heading-v22|detail-tabs-v22|tournament-page-v22' src; then
            echo 'Legacy UI class names remain.' >&2
            exit 1
          fi
          if grep -F 'radial-gradient(circle at top,color-mix(in srgb,var(--q-action) 10%,transparent),transparent 32%)' src/styles/onboarding.css; then
            echo 'Old onboarding gradient remains.' >&2
            exit 1
          fi

      - name: Commit stable class migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Retire remaining versioned UI classes'
          git push origin HEAD:feature/design-consistency-pass

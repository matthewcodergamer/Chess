name: Update visual regression baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline-update
  cancel-in-progress: false

jobs:
  update:
    name: Deliberately regenerate canonical screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate canonical screenshots
        run: npm run test:visual:update

      - name: Verify baseline matrix
        shell: bash
        run: |
          count=$(find tests/e2e/visual-baselines -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Generated $count visual baselines"
          if [ "$count" -ne 45 ]; then
            echo "::error::Expected exactly 45 visual baselines; found $count."
            exit 1
          fi

      - name: Commit deliberate baseline update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-baselines
          if git diff --cached --quiet; then
            echo "Canonical screenshots are already current."
            exit 0
          fi
          git commit -m "Update canonical visual regression baselines"
          git push origin HEAD:main

name: Apply shared physical chess clock

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-shared-physical-clock.mjs'
      - '.github/workflows/apply-shared-physical-clock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply shared physical clock migration
        run: node scripts/apply-shared-physical-clock.mjs
      - name: Normalize Premium clock preference import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/premium/PremiumBoard3D.tsx')
          source = path.read_text()
          source = source.replace(
              "import { showClock as getClockVisible, setClockVisible, subscribeClockVisible } from '../ui/clockPreference';",
              "import { clockVisible as getClockVisible, setClockVisible, subscribeClockVisible } from '../ui/clockPreference';",
          )
          path.write_text(source)
          PY
      - name: Verify production build
        run: npm run build
      - name: Commit clock consolidation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/LocalGame.tsx src/multiplayer/OnlineArena.tsx src/premium/PremiumBoard3D.tsx src/styles/board.css
          git diff --cached --quiet && exit 0
          git commit -m "Use one physical clock across every game mode"
          git push origin main

name: Apply shared physical chess clock

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-shared-physical-clock.mjs'
      - '.github/workflows/apply-shared-physical-clock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply shared physical clock migration
        run: node scripts/apply-shared-physical-clock.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit clock consolidation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/LocalGame.tsx src/multiplayer/OnlineArena.tsx src/premium/PremiumBoard3D.tsx src/styles/board.css
          git diff --cached --quiet && exit 0
          git commit -m "Use one physical clock across every game mode"
          git push origin main

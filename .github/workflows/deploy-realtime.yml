name: Deploy QQURZ API environment

on:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [development, staging, production]
      source_ref:
        description: Optional commit/tag to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      required_branch: ${{ steps.resolve.outputs.required_branch }}
    steps:
      - id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.deployment_environment }}
          REQUESTED_REF: ${{ inputs.source_ref }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="$REQUESTED"
          else
            case "$TRIGGER_BRANCH" in
              develop) target=development ;;
              staging) target=staging ;;
              main) target=production ;;
              *) echo "Unsupported deployment branch" >&2; exit 1 ;;
            esac
          fi

          case "$target" in
            development) required_branch=develop ;;
            staging) required_branch=staging ;;
            production) required_branch=main ;;
            *) echo "Unsupported deployment environment: $target" >&2; exit 1 ;;
          esac
          if [ "$TRIGGER_BRANCH" != "$required_branch" ]; then
            echo "Deploy $target from the $required_branch branch, not $TRIGGER_BRANCH." >&2
            exit 1
          fi

          source_ref="${REQUESTED_REF:-$TRIGGER_SHA}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "required_branch=$required_branch" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.target }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 0

      - id: source
        name: Resolve immutable release SHA
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deployment and CI architecture
        run: npm run check:deploy && npm run check:ci

      - name: Frontend TypeScript and lint safety check
        run: npm run typecheck && npm run lint

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Server domain tests
        working-directory: server
        run: npm test

      - name: Server type and architecture checks
        working-directory: server
        run: npm run check

      - name: Require Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing environment-scoped CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing environment-scoped CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }

      - name: Validate payment secret class
        if: needs.resolve.outputs.target != 'production'
        shell: bash
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$STRIPE_TEST_SECRET_KEY" ]; then
            case "$STRIPE_TEST_SECRET_KEY" in sk_test_*) ;; *) echo 'Nonproduction STRIPE_TEST_SECRET_KEY must begin with sk_test_.' >&2; exit 1 ;; esac
          fi

      - name: Sync stable environment secrets
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAYMENTS_INTERNAL_SECRET: ${{ secrets.PAYMENTS_INTERNAL_SECRET }}
          PAYMENTS_INTENT_SECRET: ${{ secrets.PAYMENTS_INTENT_SECRET }}
          PAYMENTS_COMPLIANCE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_COMPLIANCE_WEBHOOK_SECRET }}
          INTEGRITY_INTERNAL_SECRET: ${{ secrets.INTEGRITY_INTERNAL_SECRET }}
          INTEGRITY_ADMIN_SECRET: ${{ secrets.INTEGRITY_ADMIN_SECRET }}
          INTEGRITY_SIGNAL_SECRET: ${{ secrets.INTEGRITY_SIGNAL_SECRET }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$key" --env "$TARGET"
            fi
          }
          put_secret PAYMENTS_INTERNAL_SECRET "$PAYMENTS_INTERNAL_SECRET"
          put_secret PAYMENTS_INTENT_SECRET "$PAYMENTS_INTENT_SECRET"
          put_secret PAYMENTS_COMPLIANCE_WEBHOOK_SECRET "$PAYMENTS_COMPLIANCE_WEBHOOK_SECRET"
          put_secret INTEGRITY_INTERNAL_SECRET "$INTEGRITY_INTERNAL_SECRET"
          put_secret INTEGRITY_ADMIN_SECRET "$INTEGRITY_ADMIN_SECRET"
          put_secret INTEGRITY_SIGNAL_SECRET "$INTEGRITY_SIGNAL_SECRET"
          put_secret WEB_PUSH_VAPID_PUBLIC_KEY "$WEB_PUSH_VAPID_PUBLIC_KEY"
          put_secret WEB_PUSH_VAPID_PRIVATE_KEY "$WEB_PUSH_VAPID_PRIVATE_KEY"

      - name: Sync test-only payment provider secrets
        if: needs.resolve.outputs.target != 'production'
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          NUVEI_TEST_MERCHANT_ID: ${{ secrets.NUVEI_TEST_MERCHANT_ID }}
          NUVEI_TEST_MERCHANT_SITE_ID: ${{ secrets.NUVEI_TEST_MERCHANT_SITE_ID }}
          NUVEI_TEST_SECRET_KEY: ${{ secrets.NUVEI_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$key" --env "$TARGET"
            fi
          }
          put_secret STRIPE_SECRET_KEY "$STRIPE_TEST_SECRET_KEY"
          put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_TEST_WEBHOOK_SECRET"
          put_secret NUVEI_MERCHANT_ID "$NUVEI_TEST_MERCHANT_ID"
          put_secret NUVEI_MERCHANT_SITE_ID "$NUVEI_TEST_MERCHANT_SITE_ID"
          put_secret NUVEI_SECRET_KEY "$NUVEI_TEST_SECRET_KEY"

      - id: worker_deploy
        name: Atomically deploy isolated Worker version
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env "$TARGET" --var "RELEASE_ID:$RELEASE_SHA"

      - id: smoke
        name: Smoke test deployed API
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          CONFIGURED_API: ${{ vars.API_BASE_URL }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          api="$CONFIGURED_API"
          if [ -z "$api" ]; then
            case "$TARGET" in
              development) api='https://qqurz-chess-api-development.gamerstriper.workers.dev' ;;
              staging) api='https://qqurz-chess-api-staging.gamerstriper.workers.dev' ;;
              production) api='https://qqurz-chess-api.gamerstriper.workers.dev' ;;
            esac
          fi
          case "$api" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS.' >&2; exit 1 ;; esac
          payload="$(curl --retry 3 --retry-delay 2 --fail --silent --show-error "$api/_health")"
          node -e 'const p=JSON.parse(process.argv[1]);if(!p.ok||p.environment!==process.argv[2]||p.release!==process.argv[3])process.exit(1)' "$payload" "$TARGET" "$RELEASE_SHA"
          echo "API health check passed for $TARGET ($RELEASE_SHA)."

      - name: Roll back unhealthy Worker release
        if: steps.worker_deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback --env "$TARGET" --message "Automatic rollback after failed QQURZ health check for $RELEASE_SHA"

      - name: Fail deployment after smoke-test rollback
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          echo 'The new Worker failed its health check and rollback was requested. The deployment is failed.' >&2
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          echo "### QQURZ API deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ needs.resolve.outputs.target }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Normal branch deployment was released only after the complete quality workflow succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker publication is atomic; failed post-deploy health checks request an automatic rollback." >> "$GITHUB_STEP_SUMMARY"
          echo "- Payments: nonproduction test-only; production remains fail-closed" >> "$GITHUB_STEP_SUMMARY"

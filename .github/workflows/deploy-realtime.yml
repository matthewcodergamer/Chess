name: Deploy QQURZ realtime server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/deploy-realtime.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shared app dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck server
        run: npm run check

      - name: Verify Cloudflare login
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure integrity capabilities
        shell: bash
        run: |
          set -euo pipefail
          INTERNAL_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTEGRITY_INTERNAL_SECRET
          if [ -n "${INTEGRITY_ADMIN_SECRET:-}" ]; then
            printf '%s' "$INTEGRITY_ADMIN_SECRET" | npx wrangler secret put INTEGRITY_ADMIN_SECRET
          fi
          if [ -n "${INTEGRITY_SIGNAL_SECRET:-}" ]; then
            printf '%s' "$INTEGRITY_SIGNAL_SECRET" | npx wrangler secret put INTEGRITY_SIGNAL_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INTEGRITY_ADMIN_SECRET: ${{ secrets.INTEGRITY_ADMIN_SECRET }}
          INTEGRITY_SIGNAL_SECRET: ${{ secrets.INTEGRITY_SIGNAL_SECRET }}

      - name: Ensure stable Web Push VAPID keys
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_JSON="$(npx wrangler secret list --format json)"
          HAS_PUBLIC="$(printf '%s' "$SECRETS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);process.stdout.write(a.some(x=>x.name==='WEB_PUSH_VAPID_PUBLIC_KEY')?'1':'0')})")"
          HAS_PRIVATE="$(printf '%s' "$SECRETS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);process.stdout.write(a.some(x=>x.name==='WEB_PUSH_VAPID_PRIVATE_KEY')?'1':'0')})")"

          if [ "$HAS_PUBLIC" = "1" ] && [ "$HAS_PRIVATE" = "1" ]; then
            echo "Web Push VAPID keys already configured; preserving the existing pair."
            exit 0
          fi
          if [ "$HAS_PUBLIC" != "$HAS_PRIVATE" ]; then
            echo "Only one Web Push VAPID key is configured. Refusing to create a mismatched pair." >&2
            exit 1
          fi

          umask 077
          node --input-type=module <<'NODE'
          import { generateVAPIDKeys } from 'web-push-neo';
          import { writeFile } from 'node:fs/promises';
          const keys = await generateVAPIDKeys();
          await writeFile('.vapid-public', keys.publicKey, { mode: 0o600 });
          await writeFile('.vapid-private', keys.privateKey, { mode: 0o600 });
          NODE
          printf '%s' "$(cat .vapid-public)" | npx wrangler secret put WEB_PUSH_VAPID_PUBLIC_KEY
          printf '%s' "$(cat .vapid-private)" | npx wrangler secret put WEB_PUSH_VAPID_PRIVATE_KEY
          rm -f .vapid-public .vapid-private
          echo "Created and stored the initial Web Push VAPID key pair."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

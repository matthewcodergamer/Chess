name: Package QQURZ source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create source ZIP
        run: |
          zip -r "QQURZ-Chess-v${VERSION}-source.zip" . \
            -x '.git/*' \
               'node_modules/*' \
               'dist/*' \
               'server/node_modules/*' \
               'server/.wrangler/*'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qqurz-chess-v${{ env.VERSION }}-source
          path: QQURZ-Chess-v${{ env.VERSION }}-source.zip
          retention-days: 7

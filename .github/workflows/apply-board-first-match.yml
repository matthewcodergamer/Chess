name: Apply board-first 2D match layout

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-board-first-match.mjs'
      - '.github/workflows/apply-board-first-match.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize migration template literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-board-first-match.mjs')
          source = path.read_text()
          source = source.replace("finishLocalGame(\\`${opposite(bottomColor) === 'white' ? 'White' : 'Black'} wins by resignation\\`)", "finishLocalGame(\\`\\${opposite(bottomColor) === 'white' ? 'White' : 'Black'} wins by resignation\\`)")
          source = source.replace("key={\\`${move}-${index}\\`}", "key={move + '-' + index}")
          path.write_text(source)
          PY
      - name: Apply board-first match migration
        run: node scripts/apply-board-first-match.mjs
      - name: Commit match layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/LocalGame.tsx src/multiplayer/OnlineArena.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make 2D match board first"
          git push origin main

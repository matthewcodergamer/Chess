name: QQURZ fix matchmaker syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[qqurz-syntax-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated method signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/src/matchmaker.ts')
          s=p.read_text()
          old='async fetch(async fetch(request: Request): Promise<Response> {'
          new='async fetch(request: Request): Promise<Response> {'
          if old not in s: raise SystemExit('malformed signature not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/matchmaker.ts
          git rm .github/workflows/qqurz-fix-matchmaker-syntax.yml
          git commit -m "Fix matchmaking method signature [qqurz-syntax-fix]"
          git push

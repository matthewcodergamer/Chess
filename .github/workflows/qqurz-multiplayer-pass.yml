''', '\n')
          replace('src/multiplayer/OnlineArena.tsx', "            {gameSession?.pendingClockPress === seat.color && !showClock && <button className={`clock-slap-inline ${seat.color}`} onClick={() => send({ type: 'clock_slap' })} disabled={!connectedToRoom}>Slap clock</button>}\n", '')
          replace('src/multiplayer/OnlineArena.tsx', " : gameSession?.pendingClockPress === seat.color ? 'Move made — press your clock' : gameSession?.pendingClockPress ? 'Opponent is pressing their clock' :", " : gameSession?.pendingClockPress ? 'Synchronizing move state…' :")

          replace('src/multiplayer/OnlineArena.tsx', "  const [connection, setConnection] = useState<RoomConnectionStatus | 'idle'>('idle');\n", "  const [connection, setConnection] = useState<RoomConnectionStatus | 'idle'>('idle');\n  const recoveredOnce = useRef(false);\n")
          replace('src/multiplayer/OnlineArena.tsx', "  const connectionLabel = connection === 'connected' ? 'Connected'\n    : connection === 'reconnecting' ? 'Reconnecting…'", "  const connectionLabel = connection === 'connected' ? (snapshot ? (recoveredOnce.current ? 'Restored' : 'Connected') : 'Synchronizing…')\n    : connection === 'reconnecting' ? 'Reconnecting…'")
          replace('src/multiplayer/OnlineArena.tsx', "      setSnapshot(event.room);\n      setSnapshotAt(receivedAt);", "      setSnapshot(event.room);\n      if (connection === 'reconnecting') recoveredOnce.current = true;\n      setSnapshotAt(receivedAt);")

          with Path('src/styles/launch-fixes.css').open('a') as f:
              f.write('''

/* Multiplayer release guardrails: the board is fluid and never creates a horizontal scroll region. */
html, body, #root { max-width: 100%; overflow-x: clip; }
.online-room-shell, .qqurz-matchmaking-page { max-width: 100%; min-width: 0; overflow-x: clip; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

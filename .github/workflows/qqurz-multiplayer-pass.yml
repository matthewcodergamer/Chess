  .match-player-bar { gap: 8px; }
  .match-player-main { min-width: 0; }
  .match-player-time { flex: 0 0 auto; }
}
''')

          Path('docs/MULTIPLAYER_CAPACITY.md').write_text('''# QQURZ Multiplayer Capacity

QQURZ uses Cloudflare Workers + Durable Objects for realtime multiplayer. Each chess game is its own authoritative Durable Object; the public matchmaking queue is a shared lobby actor.

## What to measure

- concurrent WebSocket connections
- WebSocket messages/second and broadcast fan-out
- matchmaking queue depth and enqueue/status operations
- active games and average game duration
- Durable Object CPU time and storage latency
- account/data query latency and connection pressure
- API p50/p95/p99 latency
- reconnect rate, duplicate commands, and failed room allocations

## Scaling order

1. Keep one Durable Object per logical game so state and clock authority stay local to the match.
2. Measure the global matchmaking actor under production load.
3. If matchmaking becomes the hot actor, shard the queue by compatible market/region/time-control buckets while preserving deterministic matching rules.
4. Keep static frontend traffic separate from realtime Workers/WebSockets.
5. Change Cloudflare plan/resources only after metrics show a real account/CPU/request/storage limit.

Cloudflare documents Durable Objects as independently scalable stateful actors and recommends hibernatable WebSockets for long-lived realtime connections. A hibernatable Durable Object can support up to 32,768 WebSocket connections at the API level, but CPU/memory/workload limits can reduce practical capacity; this is why QQURZ should scale by logical-object sharding rather than treating a single lobby as the entire multiplayer backend.
''')

          Path('tests/unit/multiplayer-pass.test.ts').write_text('''import test from 'node:test';
import assert from 'node:assert/strict';
import { readdirSync, readFileSync } from 'node:fs';

test('public matchmaking uses atomic game allocation and no slap UI', () => {
  const matchmaker = readFileSync('server/src/matchmaker.ts', 'utf8');
  const room = readFileSync('server/src/index.ts', 'utf8');
  const arena = readFileSync('src/multiplayer/OnlineArena.tsx', 'utf8');
  assert.match(matchmaker, /room\\.internal\\/match/);
  assert.match(room, /url\\.pathname === '\\/match'/);
  assert.doesNotMatch(arena, /PhysicalChessClock/);
  assert.doesNotMatch(arena, /clock-slap-inline/);
  assert.doesNotMatch(arena, /press your clock/i);
});

test('public UI has no platform-fee percentage', () => {
  const walk = (dir) => readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
    const full = `${dir}/${entry.name}`;
    if (entry.isDirectory()) return walk(full);
    return /\\.(tsx?|css|html|json|md)$/.test(entry.name) ? [full] : [];
  });
  for (const root of ['src', 'public']) {
    for (const file of walk(root)) assert.doesNotMatch(readFileSync(file, 'utf8'), /20\\s*%/);
  }
  assert.doesNotMatch(readFileSync('index.html', 'utf8'), /20\\s*%/);
});
''')

      - name: Commit applied pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts server/src/matchmaker.ts server/src/authoritativeRoom.ts src/multiplayer/OnlineArena.tsx src/styles/launch-fixes.css docs/MULTIPLAYER_CAPACITY.md tests/unit/multiplayer-pass.test.ts
          git diff --cached --check
          git commit -m "Implement authoritative QQURZ multiplayer pass"
          git push

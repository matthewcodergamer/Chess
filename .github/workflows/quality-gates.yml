name: QQURZ automated quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-analysis:
    name: TypeScript + lint + architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: CI architecture guard
        run: npm run check:ci
      - name: Deployment environment architecture
        run: npm run check:deploy
      - name: Frontend TypeScript
        run: npm run typecheck
      - name: Source lint
        run: npm run lint
      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Backend TypeScript and architecture
        working-directory: server
        run: npm run check

  unit-integration:
    name: Unit + integration + server domain tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Realtime domain tests
        working-directory: server
        run: npm test

  production-build:
    name: Production build + bundle budgets
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production artifact
        env:
          VITE_MULTIPLAYER_API: https://qqurz-chess-api-development.gamerstriper.workers.dev
          VITE_DEPLOYMENT_ENV: ci
          VITE_RELEASE_ID: ${{ github.sha }}
        run: npm run build:artifact
      - name: Enforce bundle-size budgets
        run: npm run check:bundle
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqurz-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  mobile-e2e:
    name: Playwright iPhone + desktop end-to-end
    runs-on: ubuntu-latest
    needs: production-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright mobile and desktop flows
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-integration, production-build, mobile-e2e]
    if: always()
    steps:
      - name: Require every CI gate to pass
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TEST_RESULT: ${{ needs.unit-integration.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          E2E_RESULT: ${{ needs.mobile-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$STATIC_RESULT" "$TEST_RESULT" "$BUILD_RESULT" "$E2E_RESULT"; do
            test "$result" = success || { echo "A required CI gate did not pass: $result" >&2; exit 1; }
          done
          echo "QQURZ release gate passed for $GITHUB_SHA."

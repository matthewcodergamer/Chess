name: QQURZ automated quality gates

on:
  push:
    branches: [develop, staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: Unit + integration + server domain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Deployment environment architecture
        run: npm run check:deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Realtime domain tests
        working-directory: server
        run: npm test

      - name: Realtime type and architecture checks
        working-directory: server
        run: npm run check

  mobile-e2e:
    name: iPhone + desktop end-to-end tests
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright flows
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  visual-regression:
    name: Canonical visual regression
    runs-on: ubuntu-latest
    needs: mobile-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Require complete committed baseline matrix
        shell: bash
        run: |
          count=$(find tests/e2e/visual-baselines -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $count committed visual baselines"
          if [ "$count" -ne 45 ]; then
            echo "::error::Expected exactly 45 committed visual baselines (5 viewports × 9 surfaces); found $count."
            exit 1
          fi

      - name: Compare canonical screenshots
        run: npm run test:visual

      - name: Upload visual regression report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-visual-report/
            test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [unit-integration, mobile-e2e, visual-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app
        env:
          VITE_MULTIPLAYER_API: ${{ vars.VITE_MULTIPLAYER_API || 'https://qqurz-chess-api.gamerstriper.workers.dev' }}
          VITE_DEPLOYMENT_ENV: production
          VITE_RELEASE_ID: ${{ github.sha }}
        run: npm run build

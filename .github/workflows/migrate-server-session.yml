name: Migrate realtime to authoritative session

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-server-session.mjs'
      - 'scripts/fix-generated-server-session.mjs'
      - 'scripts/patch-authoritative-server-v2.mjs'
      - '.github/workflows/migrate-server-session.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
        working-directory: server
      - name: Apply authoritative realtime session changes
        run: |
          if grep -q "session: GameSessionModel;" server/src/index.ts; then
            node scripts/patch-authoritative-server-v2.mjs
          else
            node scripts/migrate-server-session.mjs
            node scripts/fix-generated-server-session.mjs
            node scripts/patch-authoritative-server-v2.mjs
          fi
      - name: Typecheck realtime server
        run: npm run check
        working-directory: server
      - name: Verify frontend production build
        run: npm run build
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Route realtime outcomes through GameSession"
          git push origin main

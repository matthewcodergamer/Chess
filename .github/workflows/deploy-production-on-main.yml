name: Deploy QQURZ production API from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 753e873c467138b2ff2ddf3432e7affc

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck and lint
        run: npm run typecheck && npm run lint

      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Realtime tests and checks
        working-directory: server
        run: npm test && npm run check

      - name: Build production frontend with live matchmaking API
        env:
          VITE_MULTIPLAYER_API: ${{ vars.VITE_MULTIPLAYER_API }}
          VITE_DEPLOYMENT_ENV: production
          VITE_RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="$VITE_MULTIPLAYER_API"
          if [ -z "$api" ]; then api='https://qqurz-chess-api.gamerstriper.workers.dev'; fi
          case "$api" in https://*) ;; *) echo 'VITE_MULTIPLAYER_API must use HTTPS.' >&2; exit 1 ;; esac
          VITE_MULTIPLAYER_API="$api" npm run build:artifact
          npm run check:bundle

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN.' >&2; exit 1; }

      - name: Deploy production realtime API
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env production --var "RELEASE_ID:${{ github.sha }}"

      - name: Verify production API release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload="$(curl --retry 5 --retry-delay 2 --fail --silent --show-error https://qqurz-chess-api.gamerstriper.workers.dev/_health)"
          node -e 'const p=JSON.parse(process.argv[1]); if (!p.ok || p.environment !== "production" || p.release !== process.argv[2]) process.exit(1)' "$payload" "$RELEASE_SHA"
          echo "Production API is serving $RELEASE_SHA"
          echo "Frontend deployment is handled by the GitHub Pages workflow after quality gates succeed."

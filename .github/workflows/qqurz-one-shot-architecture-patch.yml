name: QQURZ one-shot architecture patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[qqurz-arch-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative multiplayer patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/src/matchmaker.ts')
          s = p.read_text()
          old = re.search(r"  private async tryMatch\(ticket: TicketRecord, now: number\): Promise<void> \{.*?\n  \}\n\n  async fetch\(", s, re.S)
          if not old:
              raise SystemExit('tryMatch block not found')
          new = '''  private matchSerial: Promise<void> = Promise.resolve();

          private async tryMatch(ticket: TicketRecord, now: number): Promise<void> {
            const run = this.matchSerial.then(async () => {
              if (ticket.status !== 'waiting') return;
              const opponent = this.pickOpponent(ticket, now);
              if (!opponent) return;
              const seats = await this.allocateRoom(opponent, ticket);
              const latency = estimatedLatencyMs(opponent.region, ticket.region);
              opponent.status = 'matched';
              opponent.seat = seats.first;
              opponent.opponent = ticket.name;
              opponent.opponentRating = ticket.rating;
              opponent.estimatedLatencyMs = latency;
              opponent.matchedAt = now;
              ticket.status = 'matched';
              ticket.seat = seats.second;
              ticket.opponent = opponent.name;
              ticket.opponentRating = opponent.rating;
              ticket.estimatedLatencyMs = latency;
              ticket.matchedAt = now;
              this.markInGame(opponent, seats.first.code, now);
              this.markInGame(ticket, seats.second.code, now);
              this.state.queue = this.state.queue.filter(item => item !== opponent.id && item !== ticket.id);
            });
            this.matchSerial = run.catch(() => undefined);
            await run;
          }

          async fetch('''
          s = s[:old.start()] + new + s[old.end()-len("async fetch("):]
          p.write_text(s)

          p = Path('server/src/index.ts')
          s = p.read_text()
          old = """    if (!canColorMove(this.room.session, color)) return this.sendError(ws, this.room.session.pendingClockPress ? 'The previous move is waiting for a clock press.' : 'The game is not accepting that move.');"""
          new = """    if (!canColorMove(this.room.session, color)) return this.sendError(ws, 'The game is not accepting that move.');"""
          if old not in s:
              raise SystemExit('move guard not found')
          s = s.replace(old, new, 1)
          old = """    this.room.session = reduceGameSession(this.room.session, {\n      type: 'MOVE_COMMITTED', fen: makeFen(position.toSetup()), sideToMove: position.turn, mover: color, san,\n      check: position.isCheck(), checkmate: position.isCheckmate(), at: serverReceivedAt,\n    });\n    const serverCommittedAt = Date.now();"""
          new = """    this.room.session = reduceGameSession(this.room.session, {\n      type: 'MOVE_COMMITTED', fen: makeFen(position.toSetup()), sideToMove: position.turn, mover: color, san,\n      check: position.isCheck(), checkmate: position.isCheckmate(), at: serverReceivedAt,\n    });\n    // A legal move transfers the clock immediately. The client never presses a\n    // clock: the server applies the increment exactly once and starts the\n    // opponent's clock from the authoritative commit timestamp.\n    this.room.session = reduceGameSession(this.room.session, { type: 'CLOCK_TRANSFERRED', at: serverReceivedAt });\n    const serverCommittedAt = Date.now();"""
          if old not in s:
              raise SystemExit('move commit block not found')
          s = s.replace(old, new, 1)
          old = """  private async handleClockSlap(ws: WebSocket, token: string, color: Color): Promise<void> {\n    if (!this.room || this.room.session.state !== 'ACTIVE' || this.room.session.result) return this.sendError(ws, 'The clock is not accepting presses.');\n    if (this.room.session.pendingClockPress !== color) return this.sendError(ws, 'Make your move before pressing your clock.');\n    const now = Date.now(); this.settleActiveClock(now, token);\n    if (this.room.session.resultKind === 'TIMEOUT') {\n      this.room.lastActivityAt = now; await this.persist(); await this.ctx.storage.deleteAlarm(); this.broadcast(); return;\n    }\n    this.room.session = reduceGameSession(this.room.session, { type: 'CLOCK_TRANSFERRED', at: now });\n    this.room.lastActivityAt = now;\n    await this.persist(); await this.scheduleForState(); this.broadcast();\n  }"""
          new = """  private async handleClockSlap(ws: WebSocket, _token: string, _color: Color): Promise<void> {\n    return this.sendError(ws, 'The clock is automatic. Make your move to start your opponent’s clock.');\n  }"""
          if old not in s:
              raise SystemExit('clock slap handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -q "private matchSerial" server/src/matchmaker.ts
          grep -q "The clock is automatic" server/src/index.ts
          grep -q "this.room.session = reduceGameSession(this.room.session, { type: 'CLOCK_TRANSFERRED'" server/src/index.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts server/src/matchmaker.ts
          git rm .github/workflows/qqurz-one-shot-architecture-patch.yml
          git commit -m "Implement authoritative multiplayer architecture [qqurz-arch-pass]"
          git push

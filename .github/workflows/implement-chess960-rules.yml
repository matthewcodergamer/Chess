name: Implement rigorous Chess960 rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Chess960 integration
        run: node scripts/apply-chess960-rules.mjs

      - name: Verify exhaustive Chess960 rules
        run: npm run check:chess960

      - name: Verify app production build
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Verify realtime server
        working-directory: server
        run: npm run check

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No Chess960 integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts src/LocalGame.tsx src/premium/PremiumBoard3D.tsx
          git commit -m "Finish rigorous Chess960 rules"
          git push

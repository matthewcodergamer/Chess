name: Apply chess-app homepage

on:
  push:
    branches: [main]
    paths:
      - 'src/ui/HomeDashboard.tsx'
      - 'src/ui/HomeBoardPreview.tsx'
      - 'src/styles/home.css'
      - 'scripts/apply-home-dashboard.mjs'
      - '.github/workflows/apply-home-dashboard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire dashboard and responsive layout
        run: node scripts/apply-home-dashboard.mjs
      - name: Validate production build
        run: npm ci && npm run build
      - name: Commit dashboard wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/AppV14.tsx src/styles/responsive.css
          git diff --cached --quiet && exit 0
          git commit -m "Finish chess-app homepage dashboard"
          git push origin main

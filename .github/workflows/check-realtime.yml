name: Validate QQURZ realtime server

on:
  push:
    branches: [main, qqurz-realtime-server]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/multiplayer/**'
      - 'src/account/**'
      - 'src/profile/**'
      - 'src/premium/**'
      - 'src/game/**'
      - 'src/LocalGame.tsx'
      - 'src/AppV14.tsx'
      - 'scripts/check-account-system.mjs'
      - 'scripts/check-clock-system.mjs'
      - 'scripts/check-engine-isolation.mjs'
      - 'scripts/check-3d-presentation-boundary.mjs'
      - 'package.json'
      - '.github/workflows/check-realtime.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/multiplayer/**'
      - 'src/account/**'
      - 'src/profile/**'
      - 'src/premium/**'
      - 'src/game/**'
      - 'src/LocalGame.tsx'
      - 'src/AppV14.tsx'
      - 'scripts/check-account-system.mjs'
      - 'scripts/check-clock-system.mjs'
      - 'scripts/check-engine-isolation.mjs'
      - 'scripts/check-3d-presentation-boundary.mjs'
      - 'package.json'
      - '.github/workflows/check-realtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  realtime-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared app dependencies
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck server
        run: npm run check
      - name: Dry-run Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

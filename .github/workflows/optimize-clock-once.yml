name: Optimize QQURZ clock interaction once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-clock-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qqurz-clock-optimize-once
  cancel-in-progress: false

jobs:
  optimize-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply clock interaction optimization
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # Larger finger targets and a much faster physical rocker response.
          replace_exact('src/premium/ChessClock3D.ts',
                        'new THREE.BoxGeometry(1.95, 0.48, 1.45)',
                        'new THREE.BoxGeometry(2.18, 0.62, 1.66)')
          replace_exact('src/premium/ChessClock3D.ts',
                        'hit.position.set(x, 1.48, -0.10);',
                        'hit.position.set(x, 1.49, -0.10);')
          replace_exact('src/premium/ChessClock3D.ts', 'const duration = 150;', 'const duration = 82;')
          replace_exact('src/premium/ChessClock3D.ts',
                        'const overshoot = Math.sin(Math.PI * t) * target * 0.22;',
                        'const overshoot = Math.sin(Math.PI * t) * target * 0.10;')

          # 2D side clock: touch-down is the clock press. No waiting for pointer-up/click.
          replace_exact('src/ui/ChessClockViewport.tsx',
                        "const camera = new THREE.PerspectiveCamera(27, 1, 0.1, 50);\n    camera.position.set(0, 6.0, 4.65);\n    camera.lookAt(0, 0.55, 0.05);",
                        "const camera = new THREE.PerspectiveCamera(25, 1, 0.1, 50);\n    camera.position.set(0, 6.65, 5.25);\n    camera.lookAt(0, 0.50, 0.02);")
          replace_exact('src/ui/ChessClockViewport.tsx',
                        'model.group.scale.setScalar(1.04);\n    model.group.position.y = 0.08;',
                        'model.group.scale.setScalar(0.92);\n    model.group.position.y = 0.02;')
          replace_exact('src/ui/ChessClockViewport.tsx',
          '''    const raycaster = new THREE.Raycaster();
    let downSide: ClockSide | null = null;
    let moved = false;
    let sx = 0;
    let sy = 0;
    const pickSide = (event: PointerEvent): ClockSide | null => {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -(((event.clientY - rect.top) / rect.height) * 2 - 1),
      );
      raycaster.setFromCamera(ndc, camera);
      return (raycaster.intersectObjects(model.hitMeshes, false)[0]?.object.userData.clockSide as ClockSide | undefined) ?? null;
    };
    const pointerDown = (event: PointerEvent) => {
      sx = event.clientX;
      sy = event.clientY;
      moved = false;
      downSide = pickSide(event);
    };
    const pointerMove = (event: PointerEvent) => {
      if (Math.abs(event.clientX - sx) > 6 || Math.abs(event.clientY - sy) > 6) moved = true;
    };
    const pointerUp = (event: PointerEvent) => {
      if (moved || disabledRef.current) return;
      const side = pickSide(event);
      if (!side || side !== downSide || side !== pendingRef.current) return;
      animateChessClockRocker(model, side, render);
      slapRef.current?.();
    };
    renderer.domElement.addEventListener('pointerdown', pointerDown);
    renderer.domElement.addEventListener('pointermove', pointerMove);
    renderer.domElement.addEventListener('pointerup', pointerUp);
    renderer.domElement.addEventListener('pointercancel', pointerUp);''',
          '''    const raycaster = new THREE.Raycaster();
    const pickSide = (event: PointerEvent): ClockSide | null => {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -(((event.clientY - rect.top) / rect.height) * 2 - 1),
      );
      raycaster.setFromCamera(ndc, camera);
      return (raycaster.intersectObjects(model.hitMeshes, false)[0]?.object.userData.clockSide as ClockSide | undefined) ?? null;
    };
    const pointerDown = (event: PointerEvent) => {
      if (disabledRef.current) return;
      const side = pickSide(event);
      if (!side || side !== pendingRef.current) return;
      event.preventDefault();
      animateChessClockRocker(model, side, render);
      slapRef.current?.();
    };
    renderer.domElement.addEventListener('pointerdown', pointerDown, { passive: false });''')
          replace_exact('src/ui/ChessClockViewport.tsx',
                        "      renderer.domElement.removeEventListener('pointerdown', pointerDown);\n      renderer.domElement.removeEventListener('pointermove', pointerMove);\n      renderer.domElement.removeEventListener('pointerup', pointerUp);\n      renderer.domElement.removeEventListener('pointercancel', pointerUp);",
                        "      renderer.domElement.removeEventListener('pointerdown', pointerDown);")
          replace_exact('src/ui/ChessClockViewport.tsx',
          '''  return (
    <div className={`qqurz-clock-viewport ${disabled ? 'disabled' : ''} ${className}`.trim()}>
      <div ref={mount} className="qqurz-clock-canvas" aria-label="Interactive top-down QQURZ chess clock" />
      <div className="qqurz-clock-caption">
        <span>TOURNAMENT CLOCK</span>
        <small>{pendingSlap && !disabled ? `Tap the ${pendingSlap} side of the white rocker` : 'Live LCD · physical rocker'}</small>
      </div>
    </div>
  );''',
          '''  return (
    <div className={`qqurz-clock-viewport ${disabled ? 'disabled' : ''} ${pendingSlap && !disabled ? 'ready-to-slap' : ''} ${className}`.trim()}>
      <div ref={mount} className="qqurz-clock-canvas" aria-label="Interactive top-down QQURZ chess clock" />
      <div className="qqurz-clock-status" aria-hidden="true">
        {pendingSlap && !disabled ? `SLAP ${pendingSlap.toUpperCase()}` : 'LIVE CLOCK'}
      </div>
    </div>
  );''')

          # Remove the secondary/below slap button from 2D play; the physical clock is the control.
          replace_exact('src/LocalGame.tsx',
          '''          {phase === 'playing' && pendingSlap && pendingSlap !== aiColor && (
            <button className={`clock-slap-button clock-accessibility-slap ${pendingSlap}`} onClick={slapClock} aria-label={`Press ${pendingSlap} clock`}>
              <span>MOVE MADE</span><strong>SLAP {pendingSlap.toUpperCase()} CLOCK</strong><small>Tap the 3D rocker at left, or use this backup control.</small>
            </button>
          )}
''', '')

          # Premium 3D: keep the clock physically beside the board, smaller, with instant touch-down slap.
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '    handle.camera.position.set(0.2, 15.8, 15.2);\n    handle.controls.target.set(-0.45, 0.45, 0.1);',
                        '    handle.camera.position.set(0.0, 16.7, 16.8);\n    handle.controls.target.set(-0.55, 0.32, 0.08);')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '    const camera = new THREE.PerspectiveCamera(29, 1, 0.1, 100);\n    camera.position.set(0.2, 15.8, 15.2);\n    camera.lookAt(-0.45, 0.45, 0.1);',
                        '    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);\n    camera.position.set(0.0, 16.7, 16.8);\n    camera.lookAt(-0.55, 0.32, 0.08);')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '    controls.minDistance = 16;\n    controls.maxDistance = 24;',
                        '    controls.minDistance = 17;\n    controls.maxDistance = 26;')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '    controls.target.set(-0.45, 0.45, 0.1);',
                        '    controls.target.set(-0.55, 0.32, 0.08);')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '    clock.group.scale.setScalar(0.78);\n    clock.group.position.set(-5.72, -0.39, 0.95);\n    clock.group.rotation.y = 0.03;',
                        '    clock.group.scale.setScalar(0.64);\n    clock.group.position.set(-5.32, -0.39, 0.82);\n    clock.group.rotation.y = 0.02;')
          replace_exact('src/premium/PremiumBoard3D.tsx',
          '''    const pointerDown = (event: PointerEvent) => {
      sx = event.clientX;
      sy = event.clientY;
      moved = false;
      downClock = pickClock(event);
      downSquare = downClock ? null : pickSquare(event);
    };''',
          '''    const pointerDown = (event: PointerEvent) => {
      sx = event.clientX;
      sy = event.clientY;
      moved = false;
      downClock = pickClock(event);
      if (downClock) {
        event.preventDefault();
        event.stopPropagation();
        downSquare = null;
        clockSlapRef.current(downClock);
        return;
      }
      downSquare = pickSquare(event);
    };''')
          replace_exact('src/premium/PremiumBoard3D.tsx',
          '''    const pointerUp = (event: PointerEvent) => {
      if (moved) return;
      const clockSide = pickClock(event);
      if (downClock && clockSide && downClock === clockSide) {
        clockSlapRef.current(clockSide);
        return;
      }
      const up = pickSquare(event);
      if (downSquare && up && downSquare === up) selectRef.current(up);
    };''',
          '''    const pointerUp = (event: PointerEvent) => {
      if (downClock) { downClock = null; return; }
      if (moved) return;
      const up = pickSquare(event);
      if (downSquare && up && downSquare === up) selectRef.current(up);
    };''')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        "    renderer.domElement.addEventListener('pointerdown', pointerDown);",
                        "    renderer.domElement.addEventListener('pointerdown', pointerDown, { capture: true, passive: false });")
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        "      renderer.domElement.removeEventListener('pointerdown', pointerDown);",
                        "      renderer.domElement.removeEventListener('pointerdown', pointerDown, true);")
          replace_exact('src/premium/PremiumBoard3D.tsx', '<h1>Real board. Real clock. Tap the rocker.</h1>', '<h1>Move. Slap. Next turn.</h1>')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '<p>The reference-matched QQURZ tournament clock now sits beside the board, shows the live game timers, and its white rocker is the actual clock control.</p>',
                        '<p>The tournament clock sits tight beside the board. Touch your half of the white rocker and the turn passes immediately—no extra clock button.</p>')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '<span className="three-inline-note">Tap rocker to pass the turn · drag to rotate · pinch/scroll to zoom</span>',
                        '<span className="three-inline-note">Touch rocker = instant clock press · drag board to rotate · pinch/scroll to zoom</span>')
          replace_exact('src/premium/PremiumBoard3D.tsx',
                        '<div className="three-board-help">Move piece → tap matching side of white rocker</div>',
                        '<div className="three-board-help">Move → slap your side of the rocker</div>')
          replace_exact('src/premium/PremiumBoard3D.tsx',
          '''          {phase === 'playing' && pendingSlap && pendingSlap !== aiColor && (
            <button className={`clock-slap-inline three-slap ${pendingSlap}`} onClick={() => slapClock()}>
              SLAP {pendingSlap.toUpperCase()} CLOCK
            </button>
          )}
''', '')

          # Compact responsive side clock styling.
          p = Path('src/v1.9.css')
          s = p.read_text()
          s = s.replace('  margin-top: 16px;', '  margin-top: 10px;', 1)
          s = s.replace('  border-radius: 18px;', '  border-radius: 15px;', 1)
          s = s.replace('  aspect-ratio: 1.5 / 1;\n  min-height: 148px;', '  aspect-ratio: 1.92 / 1;\n  min-height: 108px;')
          s = s.replace('''.qqurz-clock-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px 10px;
  color: rgba(255,255,255,.68);
  border-top: 1px solid rgba(255,255,255,.07);
  background: rgba(7,8,9,.72);
}
.qqurz-clock-caption span {
  color: rgba(255,255,255,.9);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .12em;
}
.qqurz-clock-caption small {
  text-align: right;
  font-size: 8px;
  line-height: 1.3;
}
''', '''.qqurz-clock-status {
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 3;
  padding: 5px 7px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(7,8,9,.58);
  color: rgba(255,255,255,.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .1em;
  pointer-events: none;
}
.qqurz-clock-viewport.ready-to-slap {
  border-color: rgba(93,218,168,.58);
  box-shadow: inset 0 0 0 1px rgba(93,218,168,.14), 0 8px 20px rgba(0,0,0,.12);
}
''')
          s = s.replace('.local-clock-model { margin-bottom: 12px; }\n.local-clocks.compact-readout { margin-top: 8px; }\n.local-with-physical-clock .local-fast-side { width: 286px; }',
                        '.local-clock-model { margin-bottom: 8px; }\n.local-clocks.compact-readout { margin-top: 6px; }\n.local-with-physical-clock.local-fast-shell { grid-template-columns: 220px minmax(0,820px); gap: 14px; }\n.local-with-physical-clock .local-fast-side { width: auto; padding: 14px; }')
          s = s.replace('  .qqurz-clock-canvas { min-height: 132px; }', '  .qqurz-clock-canvas { min-height: 104px; }')
          s = s.replace('''  .local-clock-model {
    width: min(100%, 390px);
    margin-left: auto;
    margin-right: auto;
  }
  .qqurz-clock-canvas {
    aspect-ratio: 1.8 / 1;
    min-height: 150px;
  }
  .clock-accessibility-slap {
    bottom: 8px;
    min-height: 64px;
  }''', '''  .local-clock-model {
    width: min(48vw, 210px);
    margin: 0;
    align-self: start;
  }
  .qqurz-clock-canvas {
    aspect-ratio: 1.92 / 1;
    min-height: 98px;
  }
  .local-with-physical-clock .local-fast-side {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
  }
  .local-with-physical-clock .local-fast-side > div:first-child { min-width: 0; }''')
          p.write_text(s)

          # Patch version.
          replace_exact('package.json', '"version": "1.9.0"', '"version": "1.9.1"')

          # Remove this one-time workflow from the resulting source commit.
          Path('.github/workflows/optimize-clock-once.yml').unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build optimized game
        env:
          VITE_MULTIPLAYER_API: ${{ vars.VITE_MULTIPLAYER_API || 'https://qqurz-chess-api.gamerstriper.workers.dev' }}
        run: npm run build

      - name: Commit optimized clock interaction
        shell: bash
        run: |
          git config user.name "QQURZ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Optimize tournament clock for instant slap play"
          git push origin HEAD:main

      - name: Create source ZIP
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          zip -r "QQURZ-Chess-v${VERSION}-source.zip" . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'server/node_modules/*' 'server/.wrangler/*'
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qqurz-chess-v${{ env.VERSION }}-source
          path: QQURZ-Chess-v${{ env.VERSION }}-source.zip
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy optimized build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

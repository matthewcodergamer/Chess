name: Optimize QQURZ clock interaction once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-clock-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qqurz-clock-optimize-once
  cancel-in-progress: false

jobs:
  optimize-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply instant-slap clock optimization
        run: python scripts/optimize-clock-once.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build optimized game
        env:
          VITE_MULTIPLAYER_API: ${{ vars.VITE_MULTIPLAYER_API || 'https://qqurz-chess-api.gamerstriper.workers.dev' }}
        run: npm run build

      - name: Commit optimized clock interaction
        run: |
          git config user.name "QQURZ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Optimize tournament clock for instant slap play"
          git push origin HEAD:main

      - name: Read version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Create source ZIP
        run: |
          zip -r "QQURZ-Chess-v${VERSION}-source.zip" . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'server/node_modules/*' 'server/.wrangler/*'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qqurz-chess-v${{ env.VERSION }}-source
          path: QQURZ-Chess-v${{ env.VERSION }}-source.zip
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy optimized build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

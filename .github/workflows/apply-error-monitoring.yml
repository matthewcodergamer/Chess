name: Bootstrap crash and error monitoring

on:
  push:
    branches: [crash-monitor-bootstrap-20260915]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crash-monitor-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: crash-monitor-bootstrap-20260915
          fetch-depth: 0

      - name: Require unchanged production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected='f591d771260b3edd0675e31c2e3a5c9920cc42f2'
          actual="$(git rev-parse origin/main)"
          echo "Expected main: $expected"
          echo "Actual main:   $actual"
          test "$actual" = "$expected"

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/error-monitoring.b64.0 \
              .github/patches/error-monitoring.b64.1 \
              .github/patches/error-monitoring.b64.2 \
              .github/patches/error-monitoring.b64.3 > /tmp/error-monitoring.b64
          base64 --decode /tmp/error-monitoring.b64 | gzip -dc > /tmp/error-monitoring.patch
          test "$(wc -c < /tmp/error-monitoring.patch | tr -d ' ')" = '67999'
          echo 'd92ee56d45f30053f404358d05d9aeb6ac254a2e0550d32c3fb367321f9552b4  /tmp/error-monitoring.patch' | sha256sum -c -
          git apply --check /tmp/error-monitoring.patch

      - name: Apply implementation and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/error-monitoring.patch
          git apply --check .github/patches/payments-request-cast.patch
          git apply .github/patches/payments-request-cast.patch
          git apply --check .github/patches/lazy-monitor-bootstrap.patch
          git apply .github/patches/lazy-monitor-bootstrap.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-error-monitoring.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Monitoring architecture check
        run: npm run check:monitoring

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Realtime domain tests
        working-directory: server
        run: npm test

      - name: Realtime type and architecture checks
        working-directory: server
        run: npm run check

      - name: Production build
        env:
          VITE_MULTIPLAYER_API: https://qqurz-chess-api.gamerstriper.workers.dev
          VITE_RELEASE_ID: bootstrap-validation
          VITE_APP_VERSION: 1.8.0
        run: npm run build

      - name: Commit validated implementation to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qqurz-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add release-tagged crash and error monitoring'
          git push origin HEAD:crash-monitor-bootstrap-20260915

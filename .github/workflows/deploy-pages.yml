name: Deploy QQURZ frontend environment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [development, staging, production]
      source_ref:
        description: Optional commit/tag to deploy (useful for frontend rollback)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      project: ${{ steps.resolve.outputs.project }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.deployment_environment }}
          REQUESTED_REF: ${{ inputs.source_ref }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="$REQUESTED"
          else
            case "$TRIGGER_BRANCH" in
              main) target=production ;;
              *) echo "Unsupported deployment branch" >&2; exit 1 ;;
            esac
          fi

          case "$target" in
            development) required_branch=develop; project=qqurz-chess-web-development ;;
            staging) required_branch=staging; project=qqurz-chess-web-staging ;;
            production) required_branch=main; project=github-pages ;;
            *) echo "Unsupported deployment environment: $target" >&2; exit 1 ;;
          esac

          if [ "$TRIGGER_BRANCH" != "$required_branch" ]; then
            echo "Deploy $target from the $required_branch branch, not $TRIGGER_BRANCH." >&2
            exit 1
          fi

          source_ref="${REQUESTED_REF:-$TRIGGER_SHA}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "branch=$required_branch" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.target == 'production' && 'github-pages' || needs.resolve.outputs.target }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 0

      - id: source
        name: Resolve immutable release SHA
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deployment and CI architecture
        run: npm run check:deploy && npm run check:ci

      - name: TypeScript and lint preflight
        run: npm run typecheck && npm run lint

      - name: Mobile overlap release audit
        if: needs.resolve.outputs.target != 'development'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npx playwright install --with-deps webkit
          npm run test:mobile-overlap

      - name: Build environment artifact
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          CONFIGURED_API: ${{ vars.VITE_MULTIPLAYER_API }}
          RELEASE_ID: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          api="$CONFIGURED_API"
          if [ -z "$api" ]; then
            case "$TARGET" in
              development) api='https://qqurz-chess-api-development.gamerstriper.workers.dev' ;;
              staging) api='https://qqurz-chess-api-staging.gamerstriper.workers.dev' ;;
              production) api='https://qqurz-chess-api.gamerstriper.workers.dev' ;;
            esac
          fi
          case "$api" in https://*) ;; *) echo "VITE_MULTIPLAYER_API must use HTTPS." >&2; exit 1 ;; esac
          VITE_MULTIPLAYER_API="$api" VITE_DEPLOYMENT_ENV="$TARGET" VITE_RELEASE_ID="$RELEASE_ID" npm run build:artifact
          npm run check:bundle

      - name: Configure GitHub Pages
        if: needs.resolve.outputs.target == 'production'
        uses: actions/configure-pages@v5

      # Atomically deploy immutable frontend artifact to GitHub Pages.
      - name: Upload GitHub Pages artifact
        if: needs.resolve.outputs.target == 'production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy production frontend to GitHub Pages
        if: needs.resolve.outputs.target == 'production'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Require Cloudflare deployment credentials
        if: needs.resolve.outputs.target != 'production'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing environment-scoped CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing environment-scoped CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }

      - name: Deploy non-production frontend to Cloudflare Pages
        if: needs.resolve.outputs.target != 'production'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          DEPLOY_BRANCH: ${{ needs.resolve.outputs.branch }}
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$DEPLOY_BRANCH"

      - name: Deployment summary
        shell: bash
        run: |
          echo "### QQURZ frontend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ needs.resolve.outputs.target }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.resolve.outputs.target }}" = "production" ]; then
            echo "- Frontend host: **GitHub Pages**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Custom domain: **qqurzchess.com**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Frontend host: **Cloudflare Pages**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cloudflare Pages project: \`${{ needs.resolve.outputs.project }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Production deployment publishes the exact pushed main commit as an immutable Pages artifact." >> "$GITHUB_STEP_SUMMARY"

name: Apply QQURZ motion system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-motion-system.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/styles/tokens.css', '''  --q-motion-press:100ms;
            --q-motion-fast:140ms;
            --q-motion-base:180ms;
            --q-motion-slow:260ms;
            --q-motion-progress:360ms;
            --q-motion-spin:720ms;
            --q-motion-confetti:1220ms;''', '''  --q-motion-press:100ms;
            --q-motion-fast:140ms;
            --q-motion-piece:160ms;
            --q-motion-route:180ms;
            --q-motion-base:180ms;
            --q-motion-modal:200ms;
            --q-motion-drawer:220ms;
            --q-motion-slow:220ms;
            --q-motion-progress:320ms;
            --q-motion-spin:720ms;
            --q-motion-confetti:900ms;''')

          Path('src/styles/animations.css').write_text('''/* QQURZ motion language: quick, quiet, token-driven and never ornamental during play. */
          .qqurz-loading,.qqurz-route-loader{min-height:calc(100dvh - var(--q-header-h));width:100%;display:grid;place-content:center;justify-items:center;color:var(--q-muted);background:transparent}.qqurz-loading strong{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.qqurz-loading-knight{display:block!important;width:var(--q-space-24)!important;height:var(--q-space-24)!important;font-size:0!important;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 13%,currentColor 28% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),var(--q-ink-inverse) 0);mask:radial-gradient(farthest-side,transparent calc(100% - 3px),var(--q-ink-inverse) 0);color:var(--q-text)!important;animation:qqurz-wheel var(--q-motion-spin) linear infinite!important;opacity:.82}.matchmaking-spinner,.qqurz-button-spinner{animation:qqurz-wheel var(--q-motion-spin) linear infinite}
          .qqurz-home-v24,.qqurz-local-v14,.qqurz-content-page,.tournament-page-v22,.profile-page,.qqurz-matchmaking-page,.premium-gate-page,.three-play-page{animation:qqurz-route-in var(--q-motion-route) var(--q-ease-enter) both}
          .chess-drawer-backdrop{animation:qqurz-overlay-in var(--q-motion-route) var(--q-ease-standard) both}.chess-drawer{animation:qqurz-drawer-slide var(--q-motion-drawer) var(--q-ease-drawer) both}.display-popover{animation:qqurz-pop var(--q-motion-modal) var(--q-ease-enter) both}
          .modal-backdrop,.online-promotion,.local-board-overlay,.online-board-frame .board-overlay,.three-board-card .local-board-overlay{animation:qqurz-overlay-in var(--q-motion-modal) var(--q-ease-standard) both}.promotion-modal,.online-promotion>div,.local-board-overlay>div,.online-board-frame .board-overlay>div,.strategy-overlay>div{animation:qqurz-modal-in var(--q-motion-modal) var(--q-ease-enter) both}
          @keyframes qqurz-wheel{to{transform:rotate(360deg)}}
          @keyframes qqurz-route-in{from{opacity:.42;transform:translateY(var(--q-space-4))}to{opacity:1;transform:none}}
          @keyframes qqurz-overlay-in{from{opacity:0}to{opacity:1}}
          @keyframes qqurz-drawer-slide{from{transform:translateX(calc(var(--q-space-24) * -1));opacity:.56}to{transform:none;opacity:1}}
          @keyframes qqurz-pop{from{opacity:0;transform:translateY(calc(var(--q-space-4) * -1)) scale(.985)}to{opacity:1;transform:none}}
          @keyframes qqurz-modal-in{from{opacity:0;transform:translateY(var(--q-space-4)) scale(.985)}to{opacity:1;transform:none}}
          @keyframes qqurz-confetti{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4) rotate(0deg)}8%{opacity:1}42%{opacity:1;transform:translate(calc(var(--x) + var(--tx)*.72),calc(var(--y) - 150px + var(--ty)*.12)) scale(1) rotate(calc(var(--rot)*.55))}100%{opacity:0;transform:translate(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty))) scale(.9) rotate(var(--rot))}}
          ''')

          replace_once('index.html', '''        gap: 12px;''', '''        gap: 0;''')
          replace_once('index.html', '''        animation: qqurz-boot-show .12s ease-out .07s forwards;
                  transition: opacity .22s ease, visibility .22s ease;''', '''        animation: qqurz-boot-show .12s ease-out .07s forwards;
                  transition: opacity .18s ease, visibility .18s ease;''')
          replace_once('index.html', '''        width: 30px;
                  height: 30px;''', '''        width: 24px;
                  height: 24px;''')
          replace_once('index.html', '''      .qqurz-boot-label {
                  font: 700 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
                  letter-spacing: .02em;
                  opacity: .58;
                }''', '''      .qqurz-boot-label {
                  position: absolute;
                  width: 1px;
                  height: 1px;
                  overflow: hidden;
                  clip-path: inset(50%);
                  white-space: nowrap;
                }''')
          replace_once('index.html', '''        .qqurz-boot-wheel { animation-duration: 1.6s; }
                  #qqurz-boot { animation-delay: 0s; }''', '''        .qqurz-boot-wheel { animation: none; }
                  #qqurz-boot { animation: none; opacity: 1; }''')

          replace_once('src/ui/HomeBoardPreview.tsx', "import { chess960Fen } from '../game/chess960';", "import { chess960Fen } from '../game/chess960';\nimport { motionTokenMs, useReducedMotion } from './motion';")
          replace_once('src/ui/HomeBoardPreview.tsx', '''  const node = useRef<HTMLDivElement | null>(null);
            const ground = useRef<ChessgroundApi | null>(null);''', '''  const node = useRef<HTMLDivElement | null>(null);
            const ground = useRef<ChessgroundApi | null>(null);
            const reducedMotion = useReducedMotion();''')
          replace_once('src/ui/HomeBoardPreview.tsx', '''      animation: { enabled: true, duration: 180 },''', '''      animation: { enabled: !reducedMotion, duration: reducedMotion ? 0 : motionTokenMs('--q-motion-piece', 160) },''')
          replace_once('src/ui/HomeBoardPreview.tsx', '''  }, []);''', '''  }, [reducedMotion]);''')

          replace_once('src/LocalGame.tsx', "import { playChessSound } from './ui/sound';", "import { playChessSound } from './ui/sound';\nimport { motionTokenMs, useReducedMotion } from './ui/motion';")
          replace_once('src/LocalGame.tsx', '''  const aiColor = mode === 'ai' && humanColor ? opposite(humanColor) : null;
            const backRank = useMemo(() => positionId === null ? '' : chess960BackRank(positionId), [positionId]);''', '''  const aiColor = mode === 'ai' && humanColor ? opposite(humanColor) : null;
            const backRank = useMemo(() => positionId === null ? '' : chess960BackRank(positionId), [positionId]);
            const reducedMotion = useReducedMotion();
            const pieceMotionMs = reducedMotion ? 0 : motionTokenMs('--q-motion-piece', 160);''')
          replace_once('src/LocalGame.tsx', '''      animation: { enabled: true, duration: 150 },''', '''      animation: { enabled: !reducedMotion, duration: pieceMotionMs },''')
          replace_once('src/LocalGame.tsx', '''  }, [humanCanMove, lastMove, orientation]);''', '''  }, [humanCanMove, lastMove, orientation, pieceMotionMs, reducedMotion]);''')

          replace_once('src/multiplayer/OnlineArena.tsx', "import { playChessSound } from '../ui/sound';", "import { playChessSound } from '../ui/sound';\nimport { motionTokenMs, useReducedMotion } from '../ui/motion';")
          replace_once('src/multiplayer/OnlineArena.tsx', '''  const [showClock, setShowClock] = useState(clockVisible);

            const pos = useMemo(() => roomPosition(snapshot), [snapshot]);''', '''  const [showClock, setShowClock] = useState(clockVisible);
            const reducedMotion = useReducedMotion();
            const pieceMotionMs = reducedMotion ? 0 : motionTokenMs('--q-motion-piece', 160);

            const pos = useMemo(() => roomPosition(snapshot), [snapshot]);''')
          replace_once('src/multiplayer/OnlineArena.tsx', '''      animation: { enabled: true, duration: 160 },''', '''      animation: { enabled: !reducedMotion, duration: pieceMotionMs },''')
          replace_once('src/multiplayer/OnlineArena.tsx', '''  }, [pos, seat?.color, snapshot, yourTurn]);''', '''  }, [pieceMotionMs, pos, reducedMotion, seat?.color, snapshot, yourTurn]);''')

          replace_once('scripts/check-css-architecture.mjs', "  '--q-motion-press:', '--q-motion-fast:', '--q-motion-base:', '--q-motion-slow:', '--q-motion-progress:', '--q-motion-spin:',", "  '--q-motion-press:', '--q-motion-fast:', '--q-motion-piece:', '--q-motion-route:', '--q-motion-modal:', '--q-motion-drawer:', '--q-motion-base:', '--q-motion-slow:', '--q-motion-progress:', '--q-motion-spin:',")
          PY
      - name: Commit motion system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-motion-system.yml
          git add src/styles/tokens.css src/styles/animations.css src/ui/HomeBoardPreview.tsx src/LocalGame.tsx src/multiplayer/OnlineArena.tsx scripts/check-css-architecture.mjs index.html
          git commit -m "Finish QQURZ motion language"
          git push

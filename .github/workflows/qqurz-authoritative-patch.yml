# Triggered by this commit so the patch is applied by Actions rather than leaving partial source edits.
name: QQURZ authoritative multiplayer patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qqurz-authoritative-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-qqurz-authoritative-pass.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts server/src/matchmaker.ts server/src/authoritativeRoom.ts docs/MULTIPLAYER_CAPACITY.md tests/unit/multiplayer-pass.test.ts
          git diff --cached --check
          git commit -m "Implement atomic QQURZ matchmaking and replay safety"
          git push

name: QQURZ production matchmaking smoke

on:
  workflow_run:
    workflows: ["Deploy QQURZ API environment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise the production matchmaking queue
        shell: bash
        env:
          API: https://qqurz-chess-api.gamerstriper.workers.dev
          WEB: https://qqurzchess.com
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const api = process.env.API;
          const web = process.env.WEB;
          const suffix = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          // Keep the smoke pair in a distinct low-latency/time-control bucket.
          // This prevents an unrelated public player from taking one smoke ticket.
          const base = {
            variant: 'chess960',
            ratingRange: 50,
            timeControl: { id: 'smoke-10+7', baseMs: 600000, incrementMs: 7000 },
            regionPreference: 'nearest',
            maxLatencyMs: 40,
          };
          async function request(path, init = {}) {
            const response = await fetch(`${api}${path}`, {
              ...init,
              headers: { 'content-type': 'application/json', 'x-qqurz-rating': '4000', 'x-qqurz-rating-deviation': '30', 'x-qqurz-rating-provisional': '1', ...(init.headers || {}) },
              cache: 'no-store',
            });
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch {}
            if (!response.ok) throw new Error(`${init.method || 'GET'} ${path} -> HTTP ${response.status}: ${text}`);
            return body;
          }
          const a = await request('/matchmaking/enqueue', { method: 'POST', headers: { 'x-qqurz-rating': '4000', 'x-qqurz-rating-deviation': '30', 'x-qqurz-rating-provisional': '0' },
            body: JSON.stringify({ name: `Smoke-A-${suffix}`, presenceId: `smokea-${suffix}`, ...base }) });
          const b = await request('/matchmaking/enqueue', { method: 'POST', headers: { 'x-qqurz-rating': '4000', 'x-qqurz-rating-deviation': '30', 'x-qqurz-rating-provisional': '0' },
            body: JSON.stringify({ name: `Smoke-B-${suffix}`, presenceId: `smokeb-${suffix}`, ...base }) });
          if (!a.ticket || !b.ticket) throw new Error(`Matchmaking tickets missing: a=${JSON.stringify(a)} b=${JSON.stringify(b)}`);
          let first = a;
          let second = b;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            first = await request(`/matchmaking/status?ticket=${encodeURIComponent(a.ticket)}`);
            second = await request(`/matchmaking/status?ticket=${encodeURIComponent(b.ticket)}`);
            if (first.status === 'matched' && second.status === 'matched') break;
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (first.status !== 'matched' || second.status !== 'matched') throw new Error(`Players did not match: first=${JSON.stringify(first)} second=${JSON.stringify(second)}`);
          if (!first.seat?.code || first.seat.code !== second.seat?.code) throw new Error(`Players did not receive the same authoritative room: first=${JSON.stringify(first.seat)} second=${JSON.stringify(second.seat)}`);
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto(web, { waitUntil: 'domcontentloaded' });
          const result = await page.evaluate(async ({ api, firstSeat, secondSeat }) => {
            function connect(seat) {
              return new Promise((resolve, reject) => {
                const ws = new WebSocket(`${api.replace(/^http/, 'ws')}/rooms/${encodeURIComponent(seat.code)}/ws?token=${encodeURIComponent(seat.token)}`);
                const timer = setTimeout(() => { try { ws.close(); } catch {} reject(new Error('WebSocket snapshot timeout')); }, 15000);
                ws.addEventListener('message', event => {
                  let payload;
                  try { payload = JSON.parse(String(event.data)); } catch { return; }
                  // The first socket can legitimately see READY until the second
                  // matched player connects. Resolve on the first snapshot so both
                  // sockets are opened concurrently, then wait for ACTIVE below.
                  if (payload.type === 'snapshot' && payload.room) { clearTimeout(timer); resolve({ ws, room: payload.room }); }
                  if (payload.type === 'error') reject(new Error(payload.message));
                });
                ws.addEventListener('error', () => reject(new Error('WebSocket connection failed')));
              });
            }
            const [first, second] = await Promise.all([connect(firstSeat), connect(secondSeat)]);
            async function waitForActive(connection, label) {
              if (connection.room.session?.state === 'ACTIVE') return connection;
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error(`${label} did not reach ACTIVE state`)), 15000);
                const handler = event => {
                  let payload;
                  try { payload = JSON.parse(String(event.data)); } catch { return; }
                  if (payload.type === 'snapshot' && payload.room?.session?.state === 'ACTIVE') {
                    clearTimeout(timer);
                    connection.ws.removeEventListener('message', handler);
                    resolve({ ws: connection.ws, room: payload.room });
                  }
                };
                connection.ws.addEventListener('message', handler);
                // Ask the authoritative room for a fresh snapshot after the
                // listener is installed, avoiding a READY -> ACTIVE race in CI.
                try { connection.ws.send(JSON.stringify({ type: 'sync' })); } catch {}
              });
            }
            const [activeFirst, activeSecond] = await Promise.all([
              waitForActive(first, 'first player'),
              waitForActive(second, 'second player'),
            ]);
            if (activeFirst.room.session?.state !== 'ACTIVE' || activeSecond.room.session?.state !== 'ACTIVE') throw new Error(`Matched room is not active: ${activeFirst.room.session?.state}/${activeSecond.room.session?.state}`);
            if (!activeFirst.room.players?.black || !activeSecond.room.players?.black) throw new Error('Matched room does not contain both players');
            const move = new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('Opponent did not receive the first move')), 15000);
              activeSecond.ws.addEventListener('message', event => {
                let payload;
                try { payload = JSON.parse(String(event.data)); } catch { return; }
                if (payload.type === 'snapshot' && payload.room?.session?.moveNumber === 1) { clearTimeout(timer); resolve(payload.room); }
              });
            });
            activeFirst.ws.send(JSON.stringify({ type: 'move', uci: 'e2e4', clientSequence: 1, clientSentAt: Date.now() }));
            const after = await move;
            activeFirst.ws.close();
            activeSecond.ws.close();
            return { state: after.session.state, moveNumber: after.session.moveNumber, sideToMove: after.session.sideToMove, room: firstSeat.code };
          }, { api, firstSeat: first.seat, secondSeat: second.seat });
          await browser.close();
          if (result.state !== 'ACTIVE' || result.moveNumber !== 1 || result.sideToMove !== 'black') throw new Error(`Production room rejected a playable move: ${JSON.stringify(result)}`);
          console.log(`Production matchmaking room ${result.room} is active and accepted e2-e4, with the move delivered to the opponent.`);
          NODE

name: Apply QQURZ account gameplay integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-account-server-integration.mjs'
      - '.github/workflows/apply-account-server-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply account integration
        run: node scripts/apply-account-server-integration.mjs
      - name: Install shared dependencies
        run: npm install --no-audit --no-fund
      - name: Install realtime dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Typecheck realtime server
        working-directory: server
        run: npm run check
      - name: Commit account integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/index.ts server/src/tournaments.ts
          git diff --cached --quiet && exit 0
          git commit -m "Bind accounts to online games and tournaments"
          git push origin main
